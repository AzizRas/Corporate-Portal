name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: portal, POSTGRES_PASSWORD: portal, POSTGRES_DB: portal }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://portal:portal@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Бюджет скорости (стартовый JS ≤ 100 КБ gzip)
        run: |
          size=$(gzip -c web/dist/assets/index-*.js | wc -c)
          echo "index.js gzip: $size"
          test "$size" -lt 102400
