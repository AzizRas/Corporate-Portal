<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darian·Assist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: тёмная шапка с брендом и поиском; слева — сценарии звонка, техника и справочники;
   справа — рабочая зона, где каждое дерево заканчивается «талоном» решения и карточкой amoCRM. */
:root{
  --paper:#E9ECEA; --panel:#FFFFFF; --ink:#101C24; --ink-2:#3B4C54; --muted:#6B7C83;
  --line:#D2D8D5; --line-soft:#E6EAE8; --rail:#C7D0CC; --hover:#DFE4E1;
  --accent:#0B5E4F; --accent-ink:#FFFFFF; --accent-soft:#DDE8E4; --accent-softer:#F4F8F6; --accent-line:#C3D6CF;
  --p1:#B0322B; --p1-soft:#FBF1F0; --p2:#A9670A; --p2-soft:#FBF3E6; --p3:#0B5E4F; --p4:#5A6A70; --badge-ink:#FFFFFF;
  --gap-bg:#FDF7EC; --gap-line:#C2740E; --gap-ink:#6B4A0B;
  --head-bg:#101C24; --head-ink:#FFFFFF; --head-2:#1A2A33; --head-line:#33474F; --head-muted:#8FA3AC; --head-accent:#7FCBB8;
  --btn-bg:#101C24; --btn-ink:#FFFFFF;
  --f-disp:"Barlow Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1517; --panel:#152024; --ink:#E4EBE8; --ink-2:#A9BAB4; --muted:#85979D;
    --line:#2A3A3E; --line-soft:#1F2D31; --rail:#34484C; --hover:#1C2A2E;
    --accent:#4DB59C; --accent-ink:#06201A; --accent-soft:#1B3530; --accent-softer:#172A2A; --accent-line:#2B5048;
    --p1:#EC7066; --p1-soft:#3A1E1C; --p2:#E2A54B; --p2-soft:#33260F; --p3:#4DB59C; --p4:#93A5AB; --badge-ink:#0E1517;
    --gap-bg:#30260F; --gap-line:#C99036; --gap-ink:#EDCF92;
    --head-bg:#0A1113; --head-ink:#E4EBE8; --head-2:#132024; --head-line:#2A3D43; --head-muted:#7F949C; --head-accent:#7FCBB8;
    --btn-bg:#E4EBE8; --btn-ink:#0E1517;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1517; --panel:#152024; --ink:#E4EBE8; --ink-2:#A9BAB4; --muted:#85979D;
  --line:#2A3A3E; --line-soft:#1F2D31; --rail:#34484C; --hover:#1C2A2E;
  --accent:#4DB59C; --accent-ink:#06201A; --accent-soft:#1B3530; --accent-softer:#172A2A; --accent-line:#2B5048;
  --p1:#EC7066; --p1-soft:#3A1E1C; --p2:#E2A54B; --p2-soft:#33260F; --p3:#4DB59C; --p4:#93A5AB; --badge-ink:#0E1517;
  --gap-bg:#30260F; --gap-line:#C99036; --gap-ink:#EDCF92;
  --head-bg:#0A1113; --head-ink:#E4EBE8; --head-2:#132024; --head-line:#2A3D43; --head-muted:#7F949C; --head-accent:#7FCBB8;
  --btn-bg:#E4EBE8; --btn-ink:#0E1517;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--f-mono)}
.disp{font-family:var(--f-disp);letter-spacing:.02em}
a{color:var(--accent)}

/* ---------- шапка ---------- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--head-bg);color:var(--head-ink);
  border-bottom:3px solid var(--accent);
}
.hbar{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center}
.logo{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;cursor:pointer;background:none;border:0;color:var(--head-ink);padding:0}
.logo span{color:var(--head-accent)}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--head-muted);font-family:var(--f-mono);white-space:nowrap}
.search{margin-left:auto;position:relative;flex:1;max-width:440px;min-width:0}
.search input{
  width:100%;padding:9px 34px 9px 34px;border-radius:2px;border:1px solid var(--head-line);
  background:var(--head-2);color:var(--head-ink);font-family:inherit;font-size:14px;
}
.search input::placeholder{color:var(--head-muted)}
.search input:focus{outline:2px solid var(--head-accent);outline-offset:1px}
.search .ic{position:absolute;left:11px;top:8px;color:var(--head-muted);font-size:15px}
.slash{position:absolute;right:10px;top:9px;font-size:11px;color:var(--head-muted);font-family:var(--f-mono)}
#brand{
  background:var(--head-2);color:var(--head-ink);border:1px solid var(--head-line);border-radius:2px;
  padding:8px 8px;font-family:var(--f-disp);font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;max-width:170px;
}
#brand:focus-visible,#newcall:focus-visible{outline:2px solid var(--head-accent);outline-offset:1px}
#newcall{
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:2px;
  padding:8px 13px;font-family:var(--f-body);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;
}
#newcall:hover{filter:brightness(1.08)}

/* ---------- раскладка ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 18px 80px;display:grid;grid-template-columns:250px minmax(0,1fr)}
aside{border-right:1px solid var(--line);padding:20px 16px 22px 0}
main{padding:22px 0 22px 26px;min-width:0}
.navtoggle{display:none}
.navlabel{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-family:var(--f-mono);margin:0 0 10px}
.grp{margin-bottom:18px}
.grp h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-left:2px solid transparent;
  padding:5px 8px;margin:1px 0;cursor:pointer;
  font-family:inherit;font-size:14.5px;color:var(--ink);border-radius:0;
}
.navbtn:hover{background:var(--hover)}
.navbtn.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.navbtn .g{font-size:14px;width:18px;text-align:center;opacity:.8;flex:none}
.navbtn .nocrm{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--gap-line)}
.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- заголовки ---------- */
.crumbs{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);margin-bottom:6px}
h1{font-family:var(--f-disp);font-size:38px;line-height:1.05;margin:0 0 6px;font-weight:600;text-wrap:balance}
h2{font-family:var(--f-disp);font-size:25px;line-height:1.1;margin:26px 0 8px;font-weight:600;text-wrap:balance}
.sub{color:var(--ink-2);font-size:14.5px;margin:0 0 22px;max-width:70ch}
.lbl5{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);font-weight:500}
p.txt{max-width:70ch;margin:0 0 12px}

/* ---------- роутер звонка (стартовый экран) ---------- */
.router{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-width:980px}
.rbtn{
  display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--rail);
  padding:13px 15px 12px;font-family:inherit;color:var(--ink);min-width:0;
}
.rbtn:hover{border-top-color:var(--accent);background:var(--accent-softer)}
.rbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rbtn .t{font-size:16.5px;font-weight:600;line-height:1.25;display:flex;gap:9px;align-items:baseline}
.rbtn .t .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);padding:0 5px;flex:none}
.rbtn .h{font-size:13px;color:var(--ink-2);line-height:1.4}
.rbtn .c{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-top:2px}
.rbtn.main{border-top-color:var(--accent);grid-column:1/-1}
.rbtn.main .t{font-size:19px}
.rbtn.danger{border-top-color:var(--p1)}
.rbtn.danger .t{color:var(--p1)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;max-width:980px}
.quick button{font-family:inherit;font-size:13.5px;padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;border-radius:2px}
.quick button:hover{border-color:var(--accent)}

/* ---------- экран безопасности ---------- */
.safe{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;max-width:900px}
.sbtn{
  text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);
  background:var(--p1-soft);border:1px solid var(--p1);padding:13px 15px;min-width:0;
}
.sbtn b{display:block;color:var(--p1);font-size:16px;margin-bottom:2px}
.sbtn span{font-size:13px;color:var(--ink-2)}
.sbtn:hover{filter:brightness(.97)}
.sbtn.none{background:var(--panel);border-color:var(--accent)}
.sbtn.none b{color:var(--accent)}
.sbtn:focus-visible{outline:2px solid var(--p1);outline-offset:2px}

/* ---------- список симптомов ---------- */
.sym{display:grid;gap:8px;max-width:760px}
.symbtn{
  display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--rail);
  padding:12px 15px;font-family:inherit;font-size:16px;color:var(--ink);
}
.symbtn:hover{border-left-color:var(--accent);transform:translateX(2px)}
.symbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.symbtn .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.symbtn .uz{display:block;font-size:12.5px;color:var(--muted);font-family:var(--f-mono);margin-top:2px}
.symbtn .arr{margin-left:auto;color:var(--muted);flex:none}
.symbtn.red{border-left-color:var(--p1)}
@media (prefers-reduced-motion:no-preference){.symbtn{transition:transform .12s ease,border-color .12s ease}}

/* ---------- дерево ---------- */
.rail{border-left:1px solid var(--rail);margin-left:13px;padding-left:26px;position:relative}
.step{position:relative;padding-bottom:24px}
.step:last-child{padding-bottom:0}
.dot{
  position:absolute;left:-33px;top:2px;width:15px;height:15px;border-radius:50%;
  background:var(--paper);border:1px solid var(--rail);
  font-family:var(--f-mono);font-size:9px;line-height:14px;text-align:center;color:var(--muted);
}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q{font-size:19px;font-weight:600;margin:0 0 3px;line-height:1.3;max-width:62ch}
.hint{font-size:13.5px;color:var(--ink-2);margin:0 0 12px;max-width:70ch}
.hint b{color:var(--ink)}
.opts{display:grid;gap:7px;max-width:660px}
.opt{
  display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);padding:10px 14px;
  font-family:inherit;font-size:15.5px;color:var(--ink);
}
.opt:hover{border-color:var(--accent);background:var(--accent-softer)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd,.opt kbd{
  font-family:var(--f-mono);font-size:11px;background:var(--paper);
  border:1px solid var(--line);padding:1px 6px;color:var(--ink-2);flex:none;
}
.answered{background:var(--accent-soft);border:1px solid var(--accent-line);padding:8px 13px;max-width:660px}
.answered .lbl{font-size:12px;color:var(--ink-2);font-family:var(--f-mono)}
.answered .val{font-weight:600;font-size:15px}

/* ---------- талон решения ---------- */
.ticket{
  background:var(--panel);border:1px solid var(--line);max-width:760px;
  border-top:5px solid var(--pc,var(--accent));position:relative;
}
.tkhead{padding:15px 18px 13px;border-bottom:1px dashed var(--line)}
.badge{
  display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;
  background:var(--pc,var(--accent));color:var(--badge-ink);padding:3px 9px;margin-bottom:8px;
}
.tkhead h3{margin:0;font-size:22px;font-family:var(--f-disp);font-weight:600;line-height:1.2;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line-soft);border-bottom:1px dashed var(--line)}
.meta div{background:var(--panel);padding:10px 18px;min-width:0}
.meta .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
.meta .v{font-size:14.5px;font-weight:600;margin-top:2px}
.tkbody{padding:15px 18px 20px}
.tkbody h5{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);font-weight:500}
.do{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:6px;max-width:70ch}
.do li{display:flex;gap:9px;font-size:15px}
.do li::before{content:"□";color:var(--accent);font-size:15px;flex:none}
.do.nums{counter-reset:n}
.do.nums li::before{counter-increment:n;content:counter(n);font-family:var(--f-mono);font-size:11px;border:1px solid var(--accent-line);color:var(--accent);width:20px;height:20px;line-height:18px;text-align:center;flex:none;margin-top:1px}
.say{border-left:3px solid var(--accent);background:var(--accent-softer);padding:10px 14px;font-size:15.5px;margin-bottom:12px;max-width:72ch}
.say .who{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-family:var(--f-mono);display:block;margin-bottom:3px}
.say.uz{border-left-style:dashed}
.warn{border-left:3px solid var(--p1);background:var(--p1-soft);padding:10px 14px;font-size:14.5px;margin-bottom:16px;max-width:72ch}
.warn b{color:var(--p1)}
.gap{border:1px dashed var(--gap-line);background:var(--gap-bg);padding:9px 13px;font-size:13.5px;margin-bottom:16px;color:var(--gap-ink);max-width:72ch}
.gap b{color:var(--gap-ink)}
.okbox{border-left:3px solid var(--accent);background:var(--accent-softer);padding:9px 13px;font-size:14px;margin-bottom:16px;max-width:72ch}
.gapmark{font-family:var(--f-mono);background:var(--gap-bg);border:1px dashed var(--gap-line);padding:0 4px;font-size:12.5px;color:var(--gap-ink)}
.acts{display:flex;gap:9px;flex-wrap:wrap}
button.pri,button.sec{font-family:inherit;font-size:14px;padding:9px 15px;cursor:pointer;border-radius:2px}
button.pri{background:var(--btn-bg);color:var(--btn-ink);border:1px solid var(--btn-bg)}
button.pri:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.sec{background:none;color:var(--ink);border:1px solid var(--line)}
button.sec:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.footnote{margin-top:24px;font-size:12.5px;color:var(--ink-2);max-width:760px;border-top:1px solid var(--line);padding-top:12px}

/* ---------- карточка amoCRM ---------- */
.crm{border:1px solid var(--accent-line);background:var(--accent-softer);margin:4px 0 18px}
.crm .ch{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--accent-line);background:var(--accent-soft)}
.crm .ch b{font-family:var(--f-disp);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.crm .ch .stg{font-size:14px}
.crm .ch .stg code{font-weight:600}
.crm .cb{padding:10px 14px 12px}
.fl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:0;margin:0 0 10px;border-top:1px solid var(--line-soft)}
.fl>div{padding:6px 8px 6px 0;border-bottom:1px solid var(--line-soft);font-size:14px;min-width:0}
.fl .fn{color:var(--ink-2);font-size:13px}
.fl .fn .req{color:var(--p1);font-weight:600;margin-left:2px}
.fl .fv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
code,.code{font-family:var(--f-mono);font-size:13px;background:var(--panel);border:1px solid var(--line);padding:1px 6px;color:var(--ink);overflow-wrap:anywhere}
.fv small{color:var(--muted);font-size:12px}
.cp{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border:1px solid var(--accent-line);background:var(--panel);color:var(--accent);cursor:pointer;border-radius:2px;flex:none}
.cp:hover{background:var(--accent);color:var(--accent-ink)}
.chk{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px;max-width:72ch}
.chk label{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--accent);flex:none}
.chk .fmt{display:block;font-size:12.5px;color:var(--muted)}
.desc{display:block;width:100%;min-height:64px;font-family:var(--f-mono);font-size:13px;line-height:1.45;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);resize:vertical;border-radius:2px}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 14px}
.extras label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);min-width:0}
.extras input{font-family:var(--f-mono);font-size:14px;padding:7px 9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:2px;width:100%;min-width:0}
.extras input:focus{outline:2px solid var(--accent);outline-offset:0}
.res-box{font-size:13.5px;margin:-4px 0 12px;display:grid;gap:6px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border:1px solid currentColor;border-radius:999px;white-space:nowrap}
.pill.good{color:var(--accent)}
.pill.bad{color:var(--p1)}
.pill.mid{color:var(--p2)}

/* ---------- справочники ---------- */
.wcard{border:1px solid var(--line);background:var(--panel);padding:13px 15px;margin-bottom:16px;max-width:760px}
.wcard .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.wcard .bn{font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.wcard .term{font-family:var(--f-mono);font-size:13px;background:var(--accent);color:var(--accent-ink);padding:2px 8px}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:14px}
.wrow ul{margin:4px 0 0;padding-left:16px}
.wrow li{margin-bottom:2px}
.wrow .yes{color:var(--p3);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--f-mono)}
.wrow .no{color:var(--p1);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--f-mono)}
.conflict{border:1px solid var(--p1);background:var(--p1-soft);padding:10px 14px;font-size:13.5px;margin:10px 0;max-width:760px}
.conflict b{color:var(--p1)}
.conflict ul{margin:6px 0 0;padding-left:18px}
.tbl{overflow-x:auto;max-width:100%;margin-bottom:18px;border:1px solid var(--line);background:var(--panel)}
table.w{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);min-width:560px}
table.w th{text-align:left;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:bottom}
table.w td{padding:8px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}

<script>const __ASSIST = /*@@ASSIST_DATA@@*/{};

/* ==========================================================================
   DARIAN·ASSIST v2.0 — помощник оператора горячей линии 7TECH
   Сверено с amoCRM seventech.amocrm.ru 02.10.2026 (воронка «Воронка», 3 439 сделок).
   Всё, что зависит от CRM, собрано в блоке CRM ниже: если в amoCRM изменят
   поле, значение или этап — правьте только его.
   ========================================================================== */

const CRM = __ASSIST.CRM;

/* Эскалация. Метки — те же, что используются в Telegram-группе «7 tech support». */
const ESC = __ASSIST.ESC;

/* Контакты, которых нет ни в CRM, ни на сайте 7TECH. Впишите номер вместо null —
   в помощнике сразу пропадёт пометка «уточнить у супервайзера». */
const CONTACTS = __ASSIST.CONTACTS;

/* Приоритеты. Это внутренняя срочность, а не обещание клиенту по часам:
   реальный плановый срок ремонта в DCRM — 7 дней от регистрации,
   по данным CRM за сентябрь ремонт в среднем занимает около 4 дней. */
const SLA = __ASSIST.SLA;
const PLAN_DAYS = __ASSIST.PLAN_DAYS;

/* Стандартные причины закрытия. lr — значение из списка причин amoCRM при закрытии,
   txt — что вписать в обязательное поле «причина отказа». */
const CLOSE = __ASSIST.CLOSE;
const closeBy = id => CLOSE.find(c=>c.id===id);

/* ---------------- гарантия ---------------- */
/* 7TECH, сайт seventech.uz/warranty-terms: «Гарантийный срок 1 год — мы берем на себя все
   расходы: работу и запчасти» и «Бесплатное сервисное обслуживание 2 года — мы покрываем
   работу специалиста». С какой даты считать 2 года, на сайте не сказано: по умолчанию
   помощник считает их от даты покупки (осторожный вариант — ничего лишнего не обещаем).
   Правило утверждено 02.10.2026: 2 года считаются от даты покупки (всего до 24 мес.).
   full — месяцев полной гарантии, labor — до какого месяца работа мастера бесплатна,
   yesMax — до какого месяца ставить «Статус гарантии: Да». */
const W7 = __ASSIST.W7;

const UNIVERSAL_EXC = __ASSIST.UNIVERSAL_EXC;
const EXC_7TECH = __ASSIST.EXC_7TECH;
const DOCS = __ASSIST.DOCS;

const CATNAMES = __ASSIST.CATNAMES;

/* раздел помощника → категория гарантии */
const APPCAT = __ASSIST.APPCAT;

const BRANDS = __ASSIST.BRANDS;

let brand = BRANDS[0];

function catInfo(catKey){
  const c = brand.cats && brand.cats[catKey];
  if(brand.official) return {t:'1 год — работа и запчасти; до 2 лет — работа мастера бесплатно', cov:['Дефекты материалов и производственные дефекты'], exc:EXC_7TECH, exact:true};
  if(c) return {t:c.t, cov:c.cov&&c.cov.length?c.cov:['Заводской брак и производственные дефекты сборки'],
                exc:[...(c.exc||[]), ...UNIVERSAL_EXC], exact:true};
  return {t:brand.base, cov:['Заводской брак и производственные дефекты сборки'], exc:UNIVERSAL_EXC, exact:false};
}

/* ---------------- расшифровка модели 7TECH ----------------
   Префиксы сверены с моделями из 1 071 заявки в CRM и каталогом seventech.uz. */
const MODELS = __ASSIST.MODELS;

function decodeModel(raw){
  const m = String(raw||'').toUpperCase().replace(/[\s\-_.]/g,'').replace(/^SEVEN/,'7');
  if(!/^7[A-Z]/.test(m)) return null;
  const hit = MODELS.find(x=>m.startsWith(x[0]));
  if(!hit) return {model:m, prefix:null};
  return {model:m, prefix:hit[0], crm:hit[1], app:hit[2], note:hit[3]||''};
}

/* ---------------- сервисные центры и менеджеры ----------------
   Источник: файлы сервиса «7 Tech servis raqamlari» и «Adres», переданы 02.10.2026.
   crm — как СЦ называется в поле «Сервисный центр» сделки (его ставит DCRM),
   eng — как инженер записан в поле «Инженер». Телефоны — 9 цифр без +998.
   addrs.who — контактное лицо по этому адресу из файла «Adres». */
const SC = __ASSIST.SC;
/* Номер есть в файле, но регион не указан. */
const SC_EXTRA = __ASSIST.SC_EXTRA;
function fmtTel(t){ const d=String(t||'').replace(/\D/g,'').slice(-9); return d.length===9 ? '+998 '+d.slice(0,2)+' '+d.slice(2,5)+' '+d.slice(5,7)+' '+d.slice(7) : String(t||''); }
function scById(id){ return SC.find(s=>s.id===id); }
function scByPhone(digits){ const d=String(digits||'').replace(/\D/g,'').slice(-9); if(d.length<7) return null;
  for(const s of SC){ const p=s.people.find(x=>x.tel.endsWith(d)||d.endsWith(x.tel)); if(p) return {s,p}; }
  const e=SC_EXTRA.find(x=>x.tel.endsWith(d)||d.endsWith(x.tel)); return e?{s:null,p:e}:null; }
/* Магазины и шоурумы — с сайта seventech.uz/branches, проверено 02.10.2026. */
const SHOPS = __ASSIST.SHOPS;
const SUPPORT = __ASSIST.SUPPORT;

/* ---------------- фразы на узбекском для основных моментов звонка ---------------- */
const UZ = __ASSIST.UZ;

/* ---------------- даты ---------------- */
const pad2 = n => String(n).padStart(2,'0');
const fmtD = d => pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'+d.getFullYear();
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d,n) => { const x=new Date(d); x.setMonth(x.getMonth()+n); return x; };
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const planDate = () => fmtD(addDays(today(),PLAN_DAYS));
function monthsBetween(a,b){ let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) m--; return m; }
function parseDate(s){
  if(!s) return null;
  let m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m = String(s).trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
  if(m){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return new Date(y,+m[2]-1,+m[1]); }
  return null;
}
/* Статус гарантии по дате покупки — для 7TECH по правилу W7, для остальных брендов только подсказка. */
function warrantyByDate(pd){
  const t=today();
  if(pd>t) return {cls:'bad', crm:null, head:'Дата покупки позже сегодняшней', text:'Переспросите дату: в CRM уже есть заявки с датой покупки «в будущем» — это ошибка.', say:null};
  const m=monthsBetween(pd,t);
  if(!brand.official) return {cls:'mid', crm:null, head:`С покупки прошло ${m} мес.`, text:`Срок гарантии ${brand.n} — ${catInfo(APPCAT[(state.app||{}).id]||'').t}. Сверьте с гарантийным талоном, «Статус гарантии» ставьте по талону.`, say:null};
  if(m<W7.full) return {cls:'good', crm:'Да', end:fmtD(addMonths(pd,W7.full)), head:`Гарантия: ${m} мес. из ${W7.full}`, text:'Ремонт бесплатный: работа и запчасти. «Статус гарантии» — Да, «Дата окончания гарантии» — '+fmtD(addMonths(pd,W7.full))+'.', say:'Ваша техника на гарантии — ремонт бесплатный.'};
  if(m<W7.labor) return {cls:'mid', crm:m<W7.yesMax?'Да':'Нет', end:fmtD(addMonths(pd,W7.full)), head:`Бесплатный сервис: ${m} мес. с покупки`, text:`Гарантийный год закончился ${fmtD(addMonths(pd,W7.full))}. Работа мастера бесплатно до ${fmtD(addMonths(pd,W7.labor))}, запчасти — платно. «Статус гарантии» — ${m<W7.yesMax?'Да':'Нет'}. В «Комментарий»: «Бесплатный сервис: работа бесплатно, запчасти платно».`, say:'Гарантийный год закончился, но действует бесплатное сервисное обслуживание: работа мастера бесплатна, запчасти — платно. Стоимость деталей мастер назовёт до ремонта.', uz:UZ.labor};
  return {cls:'bad', crm:'Нет', end:fmtD(addMonths(pd,W7.full)), head:`Гарантия закончилась: ${m} мес. с покупки`, text:'Ремонт платный. Стоимость мастер называет до начала работ, клиент решает. «Статус гарантии» — Нет.', say:'Срок гарантии закончился, ремонт будет платным. Мастер назовёт стоимость до начала работ, и вы решите, продолжать ли.', uz:UZ.paid};
}

/* ==========================================================================
   ЭКРАН БЕЗОПАСНОСТИ. Открывается первым при любой новой неисправности.
   ========================================================================== */
const SAFE = __ASSIST.SAFE;

/* ==========================================================================
   ДЕРЕВЬЯ ТЕХНИКИ. Дерево = вопросы (q) → варианты (opts) → исход (out).
   Вариант может вести в другое дерево: go:'washer:w2' или на экран безопасности: go:'safe:gas'.
   Исходы: ticket — заявка мастеру, remote — решено по телефону, info — консультация,

function goTo(target, fromApp){
  if(!target) return;
  if(target==='home'){ home(); return; }
  if(target==='start'){ openSafety(); return; }
  const i=target.indexOf(':'); const t=target.slice(0,i), a=target.slice(i+1);
  if(t==='flow') return openFlow(a);
  if(t==='safe') return openSafe(a, fromApp===undefined?state.app:fromApp);
  if(t==='app') return openApp(a);
  if(t==='page') return openPage(a);
  if(t==='sc'){ extras.sc=a; return openPage('sc'); }
  if(t==='zc') return zOpen(a);
  return openSym(t,a);
}

function crmFor(o){

function shortAns(p){
  const a=p.a, words=a.split(/\s+/).length;
  if((/^(Да|Нет|Не )/.test(a) && a.length<32) || words<=3){
    const q=p.q.replace(/[?.]\s*$/,'').split(/[.?]\s+/).pop().replace(/\s+—.*$/,'');
    return q+' — '+a.charAt(0).toLowerCase()+a.slice(1);
  }
  return a;
}
function genDesc(o){
  const parts=[];
  const code=String(extras.code||'').trim();
  if(code) parts.push('Код '+code.toUpperCase());
  let head = state.app ? state.app.name : '';
  const md = extras.model ? decodeModel(extras.model) : null;
  if(md && md.model) head += (head?' ':'') + md.model;
  else if(String(extras.model||'').trim()) head += (head?' ':'') + extras.model.trim().toUpperCase();
  const facts = state.path.map(shortAns);
  const symName = state.kind==='safe' ? 'ОПАСНО' : state.sym.name;
  parts.push((head?head+'. ':'')+symName+(facts.length?': '+facts.join('; '):''));
  parts.push('Вывод: '+o.title);
  const spec=crmFor(o);
  if(spec.urgent) parts.push('СРОЧНО');
  return parts.join('. ').replace(/\.\s*\./g,'.').replace(/:\s*\./g,'.')+'.';
}

function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); return ok;
}
function copyText(t,msg){
  const done=()=>toast(msg||'Скопировано');
  const fail=()=>toast('Не удалось скопировать — выделите текст вручную');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>{ fallbackCopy(t)?done():fail(); }); }
    else { fallbackCopy(t)?done():fail(); }
  }catch(e){ fallbackCopy(t)?done():fail(); }
}

/* ---------- поиск: русский + узбекский (латиница и кириллица) + модель ---------- */
function canon(s){
  s=String(s||'').toLowerCase();
  const m={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'s','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya','ў':'o','қ':'k','ғ':'g','ҳ':'h'};
  s=s.replace(/[а-яёўқғҳ]/g,c=>m[c]!==undefined?m[c]:c);
  s=s.replace(/[ʻʼ'‘’`´]/g,'');
  s=s.replace(/q/g,'k').replace(/x/g,'h').replace(/w/g,'v').replace(/ts/g,'s').replace(/c(?!h)/g,'k');
  s=s.replace(/[^a-z0-9]+/g,' ').replace(/([a-z])\1+/g,'$1');
  return s.trim();
}
const STOP=new Set(['ne','va','i','u','bilan','juda','yahshi','yahsi','ham','emas','bu','da','dan','ga','ni','ning','kak','chto','eto','na','v','s','ya','mne','klient','govorit','kilib','boldi','koldi','umuman','yok','bor','ili','ochen','ploho','sovsem','vopshe','voobshe','tozhe','yoki','pochemu','u','menda','meni','bizda','kerak','iltimos','pomogite','nado']);
function pref(a,b){ let i=0; const n=Math.min(a.length,b.length); while(i<n&&a[i]===b[i]) i++; return i; }
function wordMatch(t,w){
  if(t===w) return true;
  if(t.length>=3 && w.startsWith(t)) return true;
  if(w.length>=3 && t.startsWith(w) && t.length-w.length<=4) return true;
  const p=pref(t,w);
  return p>=5 || (p>=4 && t.length>=6 && w.length>=6);
}

function buildIndex(){

  DATA.forEach(app=>{
    const dev=canon(app.name+' '+(app.uz||'')+' '+(app.crm||''));
    INDEX.push({type:'app',app,dev,txt:''});
    app.symptoms.forEach(s=>INDEX.push({type:'sym',app,s,dev,txt:canon(s.name+' '+(s.tags||'')+' '+(s.uz||''))}));
  });
  FLOWS.forEach(f=>INDEX.push({type:'flow',f,dev:'',txt:canon(f.name+' '+(f.h||'')+' '+(f.tags||'')+' '+(f.uz||''))}));
  Object.keys(SAFE).forEach(k=>INDEX.push({type:'safe',key:k,dev:'',txt:canon(SAFE[k].title+' '+SAFE_TAGS[k])}));
  SC.forEach(s=>INDEX.push({type:'sc',sc:s,dev:'',txt:canon(s.reg+' '+s.uz+' '+s.crm+' '+s.eng+' '+s.people.map(p=>p.n).join(' ')+' '+s.addrs.map(a=>a.who||'').join(' ')+' сервисный центр сц servis markazi servis manzili servis raqami')}));
  Object.entries(PAGES).forEach(([id,p])=>INDEX.push({type:'page',id,p,dev:'',txt:canon(p.idx||(p.n+' '+p.tags))}));

function scoreEntry(e,toks){
  let s=0,ht=0,hd=0;
  toks.forEach(t=>{ if(e.tw.some(w=>wordMatch(t,w))){ s+=e.tw.includes(t)?2.3:2; ht++; } else if(e.dw.some(w=>wordMatch(t,w))){ s+=1; hd++; } });
  return {s,ht,hd};
}

/* ==========================================================================
   КОДЫ ОШИБОК ZIFFLER — модель или серия → код → значение, совет клиенту, закрытие сделки
   ========================================================================== */
const ZKIND = {
  info:  {n:'Не поломка',            cls:'good'},
  wait:  {n:'Защита, подождать',     cls:'good'},
  self:  {n:'Клиент может сам',      cls:'mid'},
  reset: {n:'Перезапуск',            cls:'mid'},
  master:{n:'Нужен мастер',          cls:'bad'},
  urgent:{n:'Срочно: вода',          cls:'bad'}
};
const ZTYPE = {ac:'Кондиционеры', wm:'Стиральные машины'};
let zst = {t:'', m:'', c:''};          // выбранная таблица, модель с наклейки, код — до нового звонка
const ZCYR = {'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X',
              'а':'A','в':'B','е':'E','к':'K','м':'M','н':'H','о':'O','р':'P','с':'C','т':'T','х':'X'};
/* код: латиница в верхнем регистре, без пробелов; буква O = цифра 0 (на дисплее не отличить) */
function zNorm(s){ return String(s||'').replace(/[А-Яа-я]/g,ch=>ZCYR[ch]||ch).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0'); }
function zNear(z){ return z.replace(/^([A-Z]+)0+(?=\d)/,'$1'); }   // E09 ≈ E9, EL01 ≈ EL1
function zKey(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
const zById = id => ZTAB.find(t=>t.id===id);
const ZALL = new Set(); ZTAB.forEach(t=>t.codes.forEach(e=>[e.c].concat(e.alt||[]).forEach(c=>ZALL.add(zNorm(c)))));
const ZCOUNT = ZTAB.reduce((a,t)=>a+t.codes.length,0);
const lc1 = s => s ? s.charAt(0).toLowerCase()+s.slice(1) : s;

/* таблицы по модели с наклейки или названию серии */
function zDetect(raw){
  const out=new Set();
  const toks=String(raw||'').split(/[\s,;]+/).filter(Boolean);
  const keys=[]; toks.forEach((t,i)=>{ keys.push(zKey(t)); if(i<toks.length-1) keys.push(zKey(t+toks[i+1])); });
  keys.forEach(k=>{ if(k.length<3 || /^7/.test(k)) return;
    ZTAB.forEach(t=>{ if(t.pre.some(p=>k.startsWith(p)) || (k.length>=5 && t.models.some(m=>zKey(m).startsWith(k)))) out.add(t.id); }); });
  const words=canon(raw).split(' ').filter(w=>w.length>=3);
  if(words.length) ZTAB.forEach(t=>{
    const names=t.series.map(x=>canon(x).split(' ')[0]).concat(t.alt.map(a=>canon(a)));
    if(words.some(w=>names.some(n=>n===w || (w.length>=4 && n.startsWith(w))))) out.add(t.id);
  });
  return [...out];
}
function zFind(tids, raw){
  const z=zNorm(raw), exact=[], near=[];
  if(!z) return {exact,near};
  const zn=zNear(z);
  (tids&&tids.length?tids.map(zById):ZTAB).forEach(t=>t.codes.forEach(e=>{
    const keys=[e.c].concat(e.alt||[]).map(zNorm);
    if(keys.includes(z)) exact.push({t,e});
    else if(keys.some(k=>zNear(k)===zn)) near.push({t,e});
  }));
  return {exact,near};
}
/* коды в строке поиска: с цифрой (E6, d3, EH0A) или из одних заглавных букв (EE, CL, FF) */
function zCodeTokens(raw){
  const toks=String(raw||'').split(/[\s,;]+/).filter(Boolean), out=[];
  toks.forEach((t,i)=>{
    const z=zNorm(t);
    if(z && z.length<=5 && /\d/.test(z) && ZALL.has(z)) out.push(z);
    else if(/^[A-ZА-Я]{2,3}$/.test(t) && ZALL.has(z)) out.push(z);
    if(/^[A-Za-zА-Яа-я]{2}$/.test(t) && /^\d{2}$/.test(toks[i+1]||'')){ const j=zNorm(t+toks[i+1]); if(ZALL.has(j)) out.push(j); }
  });
  return [...new Set(out)];
}
function zPl(n){ const a=n%10, b=n%100; return a===1&&b!==11?'код':(a>=2&&a<=4&&(b<12||b>14)?'кода':'кодов'); }
function zRaz(n){ n=parseInt(n,10); const a=n%10, b=n%100; return (a>=2&&a<=4&&!(b>=12&&b<=14))?'раза':'раз'; }
function zMig(n){ n=parseInt(n,10); const a=n%10, b=n%100; return a===1&&b!==11?'мигание':(a>=2&&a<=4&&(b<12||b>14)?'мигания':'миганий'); }
/* лампы работы и таймера — на внутреннем блоке, их видит клиент; индикатор наружного блока — на плате, его смотрит только мастер */
function zBlink(e){
  if(!e.b) return '';
  if(e.b.includes('|')){ const [n,tm]=e.b.split('|'); return `лампа работы мигает ${n} ${zRaz(n)}, лампа таймера ${tm}`; }
  const ns=e.b.split(/,\s*/); return `плата наружного блока: ${ns.join(' или ')} ${zMig(ns[ns.length-1])}, смотрит мастер`;
}
function zWho(t){ const m=zst.m.trim(); return m && !/^\s*7/.test(m) && zDetect(m).includes(t.id) ? m.toUpperCase() : t.short; }

/* результаты в общем поиске: код + модель/серия или код при бренде Ziffler */
function zSearchHits(raw,toks){
  const typed=toks.some(t=>t.startsWith('zifl'));
  const zb=typed || brand.id==='ziffler';
  const zt=zDetect(raw), zc=zCodeTokens(raw);
  const model=(String(raw).split(/[\s,;]+/).find(t=>/\d/.test(t) && zDetect(t).length && !ZALL.has(zNorm(t)))||'');
  const out=[];
  if(zc.length && (zb||zt.length)){
    const seen=new Set();
    zc.forEach(c=>zFind(zt,c).exact.forEach(x=>{ const key=x.t.id+':'+x.t.codes.indexOf(x.e); if(seen.has(key)) return; seen.add(key);
      const k=ZKIND[ZTIPS[x.e.t].k];
      out.push(`<button class="r" type="button" data-go="zc:${x.t.id}:${esc(x.e.c)}:${esc(model)}">Ziffler ${esc(x.e.show||x.e.c)} — ${esc(x.e.n)}<small>коды ошибок Ziffler · ${esc(x.t.short)} · ${esc(k.n)}</small></button>`); }));
    if(!out.length) out.push(`<button class="r" type="button" data-go="zc:${zt.length===1?zt[0]:''}:${esc(zc[0])}:${esc(model)}">Код ${esc(zc[0])} — нет в таблицах Ziffler${zt.length?' для этой серии':''}<small>открыть справочник кодов Ziffler</small></button>`);
  } else if(zt.length){
    zt.forEach(id=>{ const t=zById(id); out.push(`<button class="r" type="button" data-go="zc:${id}::${esc(model)}">Коды ошибок Ziffler: ${esc(t.short)}<small>${esc(t.title)} · ${t.codes.length} ${zPl(t.codes.length)}</small></button>`); });
  } else if(typed) out.push(`<button class="r" type="button" data-go="page:zcodes">Коды ошибок Ziffler<small>расшифровка по модели и коду · совет клиенту · как закрыть сделку</small></button>`);
  return out.slice(0,6);
}

<script>
/* Узбекский: латиница → кириллица. Работает на показе, данные в базе остаются латиницей.
   fix — словарь исключений (слово в нижнем регистре → результат); значение с заглавной буквы
   (бренды: Ziffler, Immer) возвращается как есть, значение «=» оставляет слово латиницей (Wi-Fi, Clean). Правится в админке: «Исключения: латиница → кириллица». */
(function (root) {
  var V = 'aeiouўе';
  var SINGLE = { a: 'а', b: 'б', d: 'д', f: 'ф', g: 'г', h: 'ҳ', i: 'и', j: 'ж', k: 'к', l: 'л', m: 'м', n: 'н', o: 'о', p: 'п', q: 'қ', r: 'р', s: 'с',
    t: 'т', u: 'у', v: 'в', w: 'в', x: 'х', y: 'й', z: 'з', c: 'ц' };
  var APOS = /[ʻʼ‘’'`´ʹ]/g;
  var TOKEN = /[A-Za-z0-9ʻʼ‘’'`´]+/g;

  function isVowel(ch) { return !!ch && 'аеёиоуўэюя'.indexOf(ch) >= 0; }

  function convertWord(w, fix) {
    var lw = w.toLowerCase().replace(APOS, '’');
    // 1) исключения
    if (fix) {
      var key = lw.replace(/’/g, '');
      var f = fix[lw] !== undefined ? fix[lw] : fix[key];
      if (f !== undefined) {
        if (f === '=') return w;                                                 // оставить латиницей как есть
        if (f && f.charAt(0) !== f.charAt(0).toLowerCase()) return f;           // бренд: как записан
        return /^[A-Z]/.test(w) ? f.charAt(0).toUpperCase() + f.slice(1) : f;
      }
    }
    // 2) o‘ → ў, g‘ → ғ
    lw = lw.replace(/o’/g, 'ў').replace(/g’/g, 'ғ');
    var out = '', i = 0, n = lw.length;
    while (i < n) {
      var c = lw[i], two = lw.substr(i, 2);
      if (two === 'sh') { out += 'ш'; i += 2; continue; }
      if (two === 'ch') { out += 'ч'; i += 2; continue; }
      if (two === 'ts') { out += 'ц'; i += 2; continue; }
      if (two === 'yo') { out += 'ё'; i += 2; continue; }
      if (two === 'yu') { out += 'ю'; i += 2; continue; }
      if (two === 'ya') { out += 'я'; i += 2; continue; }
      if (two === 'ye') { out += 'е'; i += 2; continue; }
      if (c === 'e') { out += (i === 0 || isVowel(out[out.length - 1])) ? 'э' : 'е'; i++; continue; }
      if (c === '’') { out += (i === 0 || i === n - 1 ? '’' : 'ъ'); i++; continue; }
      out += SINGLE[c] !== undefined ? SINGLE[c] : c; i++;
    }
    if (/^[A-Z]/.test(w)) out = out.charAt(0).toUpperCase() + out.slice(1);
    return out;
  }

  // слова с цифрами, ЗАГЛАВНЫЕ (DCRM, P1) и смешанный регистр (amoCRM) не трогаем
  function skip(w) { return /[0-9]/.test(w) || /[A-Z].*[A-Z]/.test(w.replace(/^[A-Z]/, '')) || (w.length > 1 && w === w.toUpperCase() && /[A-Z]/.test(w)); }

  // Wi-Fi остаётся латиницей целиком (суффиксы после него переводятся)
  var KEEP = /Wi-?Fi/gi;
  function uzToCyr(text, fix) {
    var kept = [];
    var t = String(text == null ? '' : text).replace(KEEP, function (m) { kept.push(m); return '\u0001' + (kept.length - 1) + '\u0001'; });
    t = t.replace(TOKEN, function (w) { return skip(w) ? w : convertWord(w, fix); });
    return t.replace(/\u0001(\d+)\u0001/g, function (_m, i) { return kept[Number(i)]; });
  }
  var api = { uzToCyr: uzToCyr, hasLatin: function (s) { return /[A-Za-z]/.test(s); } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.UZCYR = api;
})(typeof window !== 'undefined' ? window : globalThis);

/* Переключатель языка клиента RU / UZ и письменность узбекского (кириллица / латиница).
   Подключается к Darian·Assist скриптом import-assist.mjs; данные остаются латиницей, перевод — на показе. */
(function () {
  var FIX = (typeof __ASSIST !== 'undefined' && __ASSIST.UZ_FIX) || {};
  var store = { get: function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var lang = store.get('assistLang', 'ru');          // ru | uz — на каком языке говорим с клиентом
  var script = store.get('assistScript', 'cyr');     // cyr | lat — как показывать узбекский
  var orig = new WeakMap();                          // исходный (латинский) текст узлов
  var busy = false, timer = 0;

  function conv(text) { return UZCYR.uzToCyr(text, FIX); }

  function textNodes(root) {
    var out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    for (var n = w.nextNode(); n; n = w.nextNode()) {
      var p = n.parentNode;
      if (!p || (p.closest && p.closest('.who, .cp, code, input, textarea, select, script, style'))) continue;
      out.push(n);
    }
    return out;
  }

  // «UZ: слова клиента» в подсказках поиска: переводим только часть после метки
  function applyNode(n, toCyr) {
    var o = orig.has(n) ? orig.get(n) : n.nodeValue;
    var inUz = n.parentNode && n.parentNode.closest && n.parentNode.closest('.uz');
    var next = o;
    if (toCyr) {
      if (inUz) { var pm = /^(\s*UZ: )/.exec(o); next = pm ? pm[1] + conv(o.slice(pm[1].length)) : conv(o); }
      else { var m = /UZ: /.exec(o); if (m) next = o.slice(0, m.index + 4) + conv(o.slice(m.index + 4)); }
    }
    if (next !== o) { if (!orig.has(n)) orig.set(n, o); if (n.nodeValue !== next) n.nodeValue = next; }
    else if (orig.has(n)) { if (n.nodeValue !== o) n.nodeValue = o; }
  }

  function markPairs(root) {
    root.querySelectorAll('.say.uz').forEach(function (u) {
      var prev = u.previousElementSibling;
      if (prev && prev.classList.contains('say') && !prev.classList.contains('uz')) prev.classList.add('has-uz');
    });
  }

  function process(root) {
    busy = true;
    try {
      markPairs(root);
      var cand = (root.matches && root.matches('.uz')) ? [root] : [];
      root.querySelectorAll('.uz').forEach(function (e) { cand.push(e); });
      cand.forEach(function (e) { textNodes(e).forEach(function (n) { applyNode(n, script === 'cyr'); }); });

      textNodes(root).forEach(function (n) { if (/UZ: /.test(orig.has(n) ? orig.get(n) : n.nodeValue)) applyNode(n, script === 'cyr'); });

  }
  function processAll() {
    process(document.body);
    busy = true;
    document.querySelectorAll('th.uzh').forEach(function (th) { th.textContent = script === 'cyr' ? 'Ўзбекча (кирилл)' : 'O‘zbekcha (lotin)'; });

  }
  // кнопка «копировать» внутри узбекского текста копирует то, что видит оператор (кириллицу)
  document.addEventListener('click', function (e) {
    var c = e.target.closest && e.target.closest('[data-copy]');
    if (c && c.closest('.uz')) {
      if (!c.dataset.orig) c.dataset.orig = c.dataset.copy;
      c.dataset.copy = script === 'cyr' ? conv(c.dataset.orig) : c.dataset.orig;
    }
  }, true);

  /* ---- интерфейс в шапке ---- */
  var bar = document.querySelector('.hbar'), nc = document.getElementById('newcall');
  var box = document.createElement('div');
  box.className = 'langbox';
  box.innerHTML = '<div class="langsw" role="group" aria-label="Язык разговора с клиентом"><button type="button" data-l="ru">RU</button><button type="button" data-l="uz">UZ</button></div>' +
    '<button type="button" class="scriptsw" id="scriptsw" title="Узбекский: кириллица / латиница"></button>';
  if (bar && nc) bar.insertBefore(box, nc);
  function sync() {
    document.body.dataset.lang = lang;
    box.querySelectorAll('[data-l]').forEach(function (b) { b.classList.toggle('on', b.dataset.l === lang); b.setAttribute('aria-pressed', b.dataset.l === lang); });
    var sb = document.getElementById('scriptsw'); sb.textContent = script === 'cyr' ? 'Кир' : 'Lat';
    sb.style.display = lang === 'uz' || true ? '' : 'none';
  }
  box.addEventListener('click', function (e) {
    var b = e.target.closest('[data-l]');
    if (b) { lang = b.dataset.l; store.set('assistLang', lang); sync(); return; }
    if (e.target.id === 'scriptsw') { script = script === 'cyr' ? 'lat' : 'cyr'; store.set('assistScript', script); sync(); processAll(); }
  });
  sync();

  var mo = new MutationObserver(function () { if (busy) return; clearTimeout(timer); timer = setTimeout(processAll, 0); });
  mo.observe(document.body, { childList: true, subtree: true });
  processAll();
})();

</script>
</body>
</html>
